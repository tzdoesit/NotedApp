<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Notes</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }
    input { padding: 8px; }
    #auth input { display: block; width: 100%; margin-bottom: 8px; box-sizing: border-box; }
    #note-input { width: 70%; }
    #message { color: #b00; min-height: 1.2em; }
  </style>
</head>
<body>

  <section id="auth">
    <h1>Notes</h1>
    <input id="username" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-button">Log in</button>
    <button id="register-button">Register</button>
    <p id="message"></p>
  </section>

  <section id="app" hidden>
    <header>
      <h1>Notes</h1>
      <button id="logout-button">Log out</button>
    </header>
    <input id="note-input" placeholder="Write a note...">
    <button id="add-button">Add</button>
    <ul id="note-list"></ul>
  </section>

  <script>
    const authSection = document.getElementById("auth");
    const appSection = document.getElementById("app");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const input = document.getElementById("note-input");
    const list = document.getElementById("note-list");

    let notes = [];

    function showAuth() {
      authSection.hidden = false;
      appSection.hidden = true;
    }

    function showApp() {
      authSection.hidden = true;
      appSection.hidden = false;
    }

    function render() {
      list.textContent = "";
      for (const note of notes) {
        const item = document.createElement("li");

        const label = document.createElement("span");
        label.textContent = note.text;

        const button = document.createElement("button");
        button.textContent = "delete";
        button.onclick = () => deleteNote(note.id);

        item.appendChild(label);
        item.appendChild(button);
        list.appendChild(item);
      }
    }

    async function loadNotes() {
      const response = await fetch("/notes");
      if (response.status === 401) {
        showAuth();
        return;
      }
      notes = await response.json();
      showApp();
      render();
    }

    async function sendCredentials(path) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: usernameInput.value.trim(),
          password: passwordInput.value
        })
      });

      if (!response.ok) {
        const error = await response.json();
        message.textContent = error.detail;
        return false;
      }
      return true;
    }

    async function login() {
      message.textContent = "";
      if (await sendCredentials("/login")) {
        passwordInput.value = "";
        loadNotes();
      }
    }

    async function register() {
      message.textContent = "";
      if (await sendCredentials("/register")) {
        login();
      }
    }

    async function logout() {
      await fetch("/logout", { method: "POST" });
      notes = [];
      showAuth();
    }

    async function addNote() {
      const text = input.value.trim();
      if (text === "") return;

      const response = await fetch("/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });
      const created = await response.json();

      notes.push(created);
      input.value = "";
      render();
    }

    async function deleteNote(id) {
      await fetch("/notes/" + id, { method: "DELETE" });
      notes = notes.filter(note => note.id !== id);
      render();
    }

    document.getElementById("login-button").onclick = login;
    document.getElementById("register-button").onclick = register;
    document.getElementById("logout-button").onclick = logout;
    document.getElementById("add-button").onclick = addNote;

    input.addEventListener("keydown", (e) => { if (e.key === "Enter") addNote(); });
    passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

    loadNotes();
  </script>
</body>
</html>
